<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>projet portfolio Alexandre Gendron 2025-2026</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap");
  </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* === Styles du carrousel === */
    .carousel {
      position: relative;
      width: 100%;
      max-width: 800px;
      height:  50vh;
      margin: 2rem auto;
      overflow: hidden;
    }

    .carousel img {
      width: 100%;
      height: auto;
      height:  50vh;
      display: block;
      transition: opacity 0.5s ease;
    }

    .carousel-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .carousel-controls button {
      background: none;
      border: 1px solid #aaa;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .carousel-controls button.active {
      background: #111;
    }
  </style>
</head>
<body>

  <section class="landing">
    <header class="header">
      <h1 class="titre_header"><a href="index.html">PORTFOLIO</a></h1>
      <h2 class="nom_header">Alexandre Gendron **</h2>
      <h2 class="annee_header">2025</h2>
    </header>
  </section>

  <main id="app">
    <div id="projet-container" v-if="projet">
      <div class="projet-detail">
        <h1 class="titre_projet">{{ projet.title }}</h1>

        <section class="container_bande">
          <div class="bande_wrapper">
            <h2 class="bande bande_projet" v-for="n in 12" :key="n">*{{ projet.title }}</h2>
          </div>
        </section>

        <!-- Carrousel Vue -->
        <div class="carousel">
          <img :src="projet.images[currentIndex]" :alt="projet.title">
        </div>

        <div class="carousel-controls">
          <button 
            v-for="(img, index) in projet.images" 
            :key="index"
            :class="{active: index === currentIndex}"
            @click="currentIndex = index">
          </button>
        </div>

        <div class="container_section_projet">
          <h2 class="titre_projet">Description</h2>
          <p class="texte_projet">{{ projet.description }}</p>
        </div>

        <div class="container_section_projet">
          <p><span class="titre_projet">Catégorie :</span> <span class="texte_projet">{{ projet.category }}</span></p>
        </div>

        <div class="container_section_projet">
          <h2 class="titre_projet">Rôles</h2>
          <ul>
            <li v-for="(role, index) in projet.roles" :key="index" class="texte_projet">{{ role }}</li>
          </ul>
        </div>

        <div class="container_section_projet" v-show="projet.conception">
          <h2 class="titre_projet">Conception</h2>
          <p class="texte_projet">{{ projet.conception }}</p>
        </div>

        <a href="index.html" class="btn-retour">← Retour</a>
      </div>
    </div>

    <div v-else>
      <h2>Chargement...</h2>
    </div>
  </main>

  <footer>
    <p class="footer">Tout droits réservés © Alexandre Gendron – Portfolio 2025</p>
  </footer>

  <!-- Librairies -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

  <script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        projet: null,
        currentIndex: 0,
      };
    },
    mounted() {
      const params = new URLSearchParams(window.location.search);
      const projetId = parseInt(params.get('proj-id'));

      fetch('projets.json')
        .then(res => res.json())
        .then(data => {
          const projet = data.find(p => p.id === projetId);
          if (projet) {
            this.projet = projet;

            // Attendre un petit délai pour que les bandes existent
            setTimeout(() => {
              document.querySelectorAll('.bande_projet').forEach(bande => {
                const width = bande.getBoundingClientRect().width;
                gsap.fromTo(
                  bande,
                  { x: 0 },
                  { x: -width * 2, duration: (width * 2) / 143, ease: "none", repeat: -1 }
                );
              });
            }, 100);
          }
        });

      // Faire défiler automatiquement le carrousel
      setInterval(() => {
        if (this.projet) {
          this.currentIndex = (this.currentIndex + 1) % this.projet.images.length;
        }
      }, 3000);
    }
  }).mount('#app');
  </script>
</body>
</html>
