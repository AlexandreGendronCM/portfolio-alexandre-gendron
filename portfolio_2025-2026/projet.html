<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>projet portfolio alexandre gendron 2025-2026</title>
   <style>
    @import url("https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap");
  </style>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap");
  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

  <link rel="stylesheet" href="styles.css" />
 
</head>



<body>

<section class="landing">
    <header class="header">
      <h1 class="titre_header" href="./index.html">PORTFOLIO</h1>
      <h2 class="nom_header">Alexandre Gendron **</h2>
      <h2 class="annee_header">2025</h2>
    </header>

    
  </section>

 
  <main id="projet-container">
    <!-- Le contenu du projet sera injecté ici -->
  </main>

  <footer>
    <p>Tout droits réservés © Alexandre Gendron – Portfolio 2025</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const projetId = parseInt(params.get('proj-id'));

    fetch('projets.json')
      .then(res => res.json())
      .then(data => {
        const projet = data.find(p => p.id === projetId);

        if (projet) {
          document.getElementById('projet-container').innerHTML = `
            <div class="projet-detail">
              <h1 class="titre_projet">${projet.title}</h1>




<section class="container_bande" id="container_bande_projet">
    <div class="bande_wrapper">
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      <h2 class="bande" id="bande_projet">*${projet.title}</h2>
      
      
      
      
     
    </div>
  </section>









              <img src="${projet.images}" alt="${projet.title}" class="img-projet">
              <div>
                <p class="texte_projet">${projet.sneakpeek}</p>
                <p class="projet-meta">Catégorie : ${projet.category}</p>
                <a href="index.html" class="btn-retour">← Retour</a>
              </div>
            </div>
          `;
        } else {
          document.getElementById('projet-container').innerHTML = `
            <h2>Projet introuvable</h2>
            <a href="index.html" class="btn-retour">Retour</a>
          `;
        }
      })
      .catch(() => {
        document.getElementById('projet-container').innerHTML = `
          <h2>Erreur lors du chargement du projet</h2>
          <a href="index.html" class="btn-retour">Retour</a>
        `;
      });
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
