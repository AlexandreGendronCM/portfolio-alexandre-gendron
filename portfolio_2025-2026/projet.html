<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>projet portfolio Alexandre Gendron 2025-2026</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap");
  </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

  

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section class="landing">
    <header class="header">
      <h1 class="titre_header"><a href="index.html">PORTFOLIO</a></h1>
      <h2 class="nom_header">Alexandre Gendron **</h2>
      <h2 class="annee_header">2025</h2>
    </header>
  </section>

  <main id="projet-container">
    <!-- Le contenu du projet sera injecté ici -->
  </main>

  <footer>
    <p class="footer">Tout droits réservés © Alexandre Gendron – Portfolio 2025</p>
  </footer>

  <!-- Librairies -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const projetId = parseInt(params.get('proj-id'));

    fetch('projets.json')
      .then(res => res.json())
      .then(data => {
        const projet = data.find(p => p.id === projetId);

        if (!projet) {
          document.getElementById('projet-container').innerHTML = `
            <h2>Projet introuvable</h2>
            <a href="index.html" class="btn-retour">Retour</a>
          `;
          return;
        }

        // Mettre le HTML sur la page
        document.getElementById('projet-container').innerHTML = `
          <div class="projet-detail">
            <h1 class="titre_projet">${projet.title}</h1>

            <section class="container_bande">
              <div class="bande_wrapper">
                ${Array(12).fill(`<h2 class="bande bande_projet">*${projet.title}</h2>`).join('')}
              </div>
            </section>

            <img src="${projet.images}" alt="${projet.title}" class="img-projet">
            <div>

                     <div class="container_section_projet">
                     <h2 class="titre_projet">Description</h2>
                     <p class="texte_projet">${projet.description}</p>
                     </div>
              

                     <div class="container_section_projet">
                     <p><span class="titre_projet">Catégorie :</span> <span class="texte_projet">${projet.category}</span></p>
                     </div>


                     <div class="container_section_projet">
                     <h2 class="titre_projet">Rôles</h2>
                      <ul>
                        ${projet.roles.map(role => `<li class="texte_projet">${role}</li>`).join('')}
                     </div>



              <a href="index.html" class="btn-retour">← Retour</a>
            </div>
          </div>
        `;
        //  Animation GSAP après fetch des infos
        document.querySelectorAll('.bande_projet').forEach(bande => {
          const width = bande.getBoundingClientRect().width;
          gsap.fromTo(bande, 
            { x: 0 }, 
            { x: -width * 2, duration: (width * 2) / 143, ease: "none", repeat: -1 }
          );
        });
      })
      .catch(() => {
        document.getElementById('projet-container').innerHTML = `
          <h2>Erreur lors du chargement du projet</h2>
          <a href="index.html" class="btn-retour">Retour</a>
        `;
      });
  </script>

</body>
</html>
